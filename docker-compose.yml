version: '3.8'

services:
  web:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 360
    volumes:
      - .:/app
      - ./data:/app/data  # Persists SQLite DB across container restarts
    env_file:
      - .env
    environment:
      - TYPHOON_API_KEY=${TYPHOON_API_KEY}
      - SQLITE_DB_PATH=/app/data/jobs.db
    restart: always
    # Expose port only to internal network (accessed by nginx)
    expose:
      - "8000"
    depends_on:
      - redis

  celery-worker:
    build: .
    command: celery -A src.celery_app worker --loglevel=info
    user: appuser
    volumes:
      - .:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - TYPHOON_API_KEY=${TYPHOON_API_KEY}
      - SQLITE_DB_PATH=/app/data/jobs.db
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
